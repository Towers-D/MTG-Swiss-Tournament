<!DOCTYPE html>
<html>
    <head>
        <title>Lobby | MTG Swiss Tournament</title>
        <link rel="stylesheet" href="assets/css/main.css" />
        <meta charset="utf-8">
    </head>
    <body>
        <!-- Input Box to add players to event -->
        <div id="input_div">
            Player Name: 
            <input type="text" id="player_input"/>
            <button id="add_player"> Add Player </button>
        </div>

        <br/>
        
        <!-- Table to display currently added players and manage (remove) - managed by Tabulator-->
        <div id="players"></div>
        <div> Number of players = <span id="player_count">0</span></div>
        <br/>

        <button id="gen_round_one"> Generate Round 1 </button>
        <button id="force_round_one"> Force Round 1 Pairings </button>

        <!--Scripts-->
        <script type="module" src="assets/TS/lobby.ts" defer></script>

    </body>
</html>
